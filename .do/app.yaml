name: teleconnect
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      repo: achandna9/teleconnect
      branch: main
      deploy_on_push: true
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    build_command: npm install
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
